# Next.js frontend. Talks to Supabase directly (its own backend, via Next.js
# Route Handlers under app/api/) - it no longer depends on the FastAPI
# backend container for reads.
#
# Start on its own:
#   docker compose -f docker-compose.frontend.yml up -d --build
#
# Requires SUPABASE_URL/SUPABASE_KEY in the root .env (same Supabase project
# the backend/scrapers write to). Included automatically by the root
# docker-compose.yml for a full-stack run.

name: news

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_KEY: ${SUPABASE_KEY}
    container_name: news-frontend
    ports:
      - "8502:3000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
    networks:
      - news-network

networks:
  news-network:
    name: news-network
