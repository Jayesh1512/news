# Next.js frontend. Reads the JSON datastore through the FastAPI backend.
#
# Start on its own:
#   docker compose -f docker-compose.frontend.yml up -d --build
#
# Included automatically by the root docker-compose.yml for a full-stack run.

name: news

include:
  - docker-compose.backend.yml

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news-frontend
    ports:
      - "8502:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - news-network

networks:
  news-network:
    name: news-network
