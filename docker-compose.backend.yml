# Backend stack: FastAPI API + Celery worker + Celery beat.
# Pulls in Redis automatically via `include`. Database is Supabase
# (Postgres) - not a local container. Set DATABASE_URL (Supabase Postgres
# connection string) and SUPABASE_URL/SUPABASE_KEY in a repo-root .env.
#
# Start on its own:
#   docker compose -f docker-compose.backend.yml up -d --build
#
# This brings up redis, backend, celery-worker and celery-beat -
# everything the backend needs, nothing from the frontend or scraper.
#
# Included automatically by the root docker-compose.yml for a full-stack run.

name: news

include:
  - docker-compose.redis.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-backend
    ports:
      - "8501:8000"
    environment:
      # Supabase Postgres connection string (RSS articles + sources).
      # Get from Supabase project Settings > Database > Connection string
      # (URI, "Connection pooling" tab recommended for serverless-style
      # connections). Required - no local Postgres container.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Supabase Postgres connection string in .env}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:8502
      API_TITLE: News Aggregator API
      API_VERSION: 0.1.0
      SCRAPE_INTERVAL_MINUTES: 15
      SCRAPE_TWITTER_INTERVAL_HOURS: 6
      MAX_ARTICLES_PER_SOURCE: 50
      TWITTER_POSTS_PER_ACCOUNT: 20
      # Supabase client (stores scraped Twitter posts via supabase-py)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_TWITTER_TABLE: ${SUPABASE_TWITTER_TABLE:-twitter_posts}
      # Twitter/X cookie auth (see twitter-scraper/README.md for how to get these)
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
      TWITTER_CT0: ${TWITTER_CT0:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - news-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-celery-worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Supabase Postgres connection string in .env}
      REDIS_URL: redis://redis:6379/0
      SCRAPE_TWITTER_INTERVAL_HOURS: 6
      TWITTER_POSTS_PER_ACCOUNT: 20
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_TWITTER_TABLE: ${SUPABASE_TWITTER_TABLE:-twitter_posts}
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
      TWITTER_CT0: ${TWITTER_CT0:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - news-network
    command: celery -A app.tasks.scrape worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-celery-beat
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Supabase Postgres connection string in .env}
      REDIS_URL: redis://redis:6379/0
      SCRAPE_TWITTER_INTERVAL_HOURS: 6
      TWITTER_POSTS_PER_ACCOUNT: 20
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_TWITTER_TABLE: ${SUPABASE_TWITTER_TABLE:-twitter_posts}
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
      TWITTER_CT0: ${TWITTER_CT0:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - news-network
    command: celery -A app.tasks.scrape beat --loglevel=info

networks:
  news-network:
    name: news-network
