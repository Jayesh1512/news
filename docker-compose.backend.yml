# Backend stack: FastAPI API + Celery worker + Celery beat.
# Pulls in Redis automatically via `include`. All scraped data is persisted
# to ./data/news.json on the host.
#
# Start on its own:
#   docker compose -f docker-compose.backend.yml up -d --build
#
# This brings up redis, backend, celery-worker and celery-beat -
# everything the backend needs, nothing from the frontend or scraper.
#
# Included automatically by the root docker-compose.yml for a full-stack run.

name: news

include:
  - docker-compose.redis.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-backend
    ports:
      - "8501:8000"
    environment:
      JSON_DATA_PATH: /data/news.json
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:8502
      API_TITLE: News Aggregator API
      API_VERSION: 0.1.0
      SCRAPE_INTERVAL_MINUTES: 15
      SCRAPE_TWITTER_INTERVAL_HOURS: 6
      MAX_ARTICLES_PER_SOURCE: 50
      TWITTER_SEARCH_QUERY: ${TWITTER_SEARCH_QUERY:-}
      TWITTER_TOPIC_SCRAPER_ENABLED: ${TWITTER_TOPIC_SCRAPER_ENABLED:-true}
      TWITTER_SEARCH_RESULTS: ${TWITTER_SEARCH_RESULTS:-10}
      TWITTER_SEARCH_TYPE: ${TWITTER_SEARCH_TYPE:-latest}
      TWITTER_REPLIES_PER_POST: ${TWITTER_REPLIES_PER_POST:-20}
      TWITTER_REQUEST_DELAY_SECONDS: ${TWITTER_REQUEST_DELAY_SECONDS:-2}
      TWITTER_PROFILE_ANALYSIS_AFTER_SCRAPE: ${TWITTER_PROFILE_ANALYSIS_AFTER_SCRAPE:-false}
      TWITTER_PROFILE_TOPIC: ${TWITTER_PROFILE_TOPIC:-}
      TWITTER_PROFILE_TOPIC_DESCRIPTION: ${TWITTER_PROFILE_TOPIC_DESCRIPTION:-}
      TWITTER_PROFILE_POSTS_PER_AUTHOR: ${TWITTER_PROFILE_POSTS_PER_AUTHOR:-15}
      TWITTER_PROFILE_SIMILARITY_THRESHOLD: ${TWITTER_PROFILE_SIMILARITY_THRESHOLD:-0.60}
      TWITTER_PROFILE_EMBEDDING_MODEL: ${TWITTER_PROFILE_EMBEDDING_MODEL:-text-embedding-3-large}
      TWITTER_PROFILE_EMBEDDING_DIMENSIONS: ${TWITTER_PROFILE_EMBEDDING_DIMENSIONS:-3072}
      TWITTER_PROFILE_SUMMARY_MODEL: ${TWITTER_PROFILE_SUMMARY_MODEL:-gpt-6-luna}
      TWITTER_PROFILE_REQUEST_DELAY_SECONDS: ${TWITTER_PROFILE_REQUEST_DELAY_SECONDS:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Twitter/X cookie auth (see twitter-scraper/README.md for how to get these)
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
      TWITTER_CT0: ${TWITTER_CT0:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    networks:
      - news-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-celery-worker
    environment:
      JSON_DATA_PATH: /data/news.json
      REDIS_URL: redis://redis:6379/0
      SCRAPE_TWITTER_INTERVAL_HOURS: 6
      TWITTER_SEARCH_QUERY: ${TWITTER_SEARCH_QUERY:-}
      TWITTER_TOPIC_SCRAPER_ENABLED: ${TWITTER_TOPIC_SCRAPER_ENABLED:-true}
      TWITTER_SEARCH_RESULTS: ${TWITTER_SEARCH_RESULTS:-10}
      TWITTER_SEARCH_TYPE: ${TWITTER_SEARCH_TYPE:-latest}
      TWITTER_REPLIES_PER_POST: ${TWITTER_REPLIES_PER_POST:-20}
      TWITTER_REQUEST_DELAY_SECONDS: ${TWITTER_REQUEST_DELAY_SECONDS:-2}
      TWITTER_PROFILE_ANALYSIS_AFTER_SCRAPE: ${TWITTER_PROFILE_ANALYSIS_AFTER_SCRAPE:-false}
      TWITTER_PROFILE_TOPIC: ${TWITTER_PROFILE_TOPIC:-}
      TWITTER_PROFILE_TOPIC_DESCRIPTION: ${TWITTER_PROFILE_TOPIC_DESCRIPTION:-}
      TWITTER_PROFILE_POSTS_PER_AUTHOR: ${TWITTER_PROFILE_POSTS_PER_AUTHOR:-15}
      TWITTER_PROFILE_SIMILARITY_THRESHOLD: ${TWITTER_PROFILE_SIMILARITY_THRESHOLD:-0.60}
      TWITTER_PROFILE_EMBEDDING_MODEL: ${TWITTER_PROFILE_EMBEDDING_MODEL:-text-embedding-3-large}
      TWITTER_PROFILE_EMBEDDING_DIMENSIONS: ${TWITTER_PROFILE_EMBEDDING_DIMENSIONS:-3072}
      TWITTER_PROFILE_SUMMARY_MODEL: ${TWITTER_PROFILE_SUMMARY_MODEL:-gpt-6-luna}
      TWITTER_PROFILE_REQUEST_DELAY_SECONDS: ${TWITTER_PROFILE_REQUEST_DELAY_SECONDS:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
      TWITTER_CT0: ${TWITTER_CT0:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    networks:
      - news-network
    command: celery -A app.tasks.scrape worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-celery-beat
    environment:
      JSON_DATA_PATH: /data/news.json
      REDIS_URL: redis://redis:6379/0
      SCRAPE_TWITTER_INTERVAL_HOURS: 6
      TWITTER_SEARCH_QUERY: ${TWITTER_SEARCH_QUERY:-}
      TWITTER_TOPIC_SCRAPER_ENABLED: ${TWITTER_TOPIC_SCRAPER_ENABLED:-true}
      TWITTER_SEARCH_RESULTS: ${TWITTER_SEARCH_RESULTS:-10}
      TWITTER_SEARCH_TYPE: ${TWITTER_SEARCH_TYPE:-latest}
      TWITTER_REPLIES_PER_POST: ${TWITTER_REPLIES_PER_POST:-20}
      TWITTER_REQUEST_DELAY_SECONDS: ${TWITTER_REQUEST_DELAY_SECONDS:-2}
      TWITTER_PROFILE_ANALYSIS_AFTER_SCRAPE: ${TWITTER_PROFILE_ANALYSIS_AFTER_SCRAPE:-false}
      TWITTER_PROFILE_TOPIC: ${TWITTER_PROFILE_TOPIC:-}
      TWITTER_PROFILE_TOPIC_DESCRIPTION: ${TWITTER_PROFILE_TOPIC_DESCRIPTION:-}
      TWITTER_PROFILE_POSTS_PER_AUTHOR: ${TWITTER_PROFILE_POSTS_PER_AUTHOR:-15}
      TWITTER_PROFILE_SIMILARITY_THRESHOLD: ${TWITTER_PROFILE_SIMILARITY_THRESHOLD:-0.60}
      TWITTER_PROFILE_EMBEDDING_MODEL: ${TWITTER_PROFILE_EMBEDDING_MODEL:-text-embedding-3-large}
      TWITTER_PROFILE_EMBEDDING_DIMENSIONS: ${TWITTER_PROFILE_EMBEDDING_DIMENSIONS:-3072}
      TWITTER_PROFILE_SUMMARY_MODEL: ${TWITTER_PROFILE_SUMMARY_MODEL:-gpt-6-luna}
      TWITTER_PROFILE_REQUEST_DELAY_SECONDS: ${TWITTER_PROFILE_REQUEST_DELAY_SECONDS:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
      TWITTER_CT0: ${TWITTER_CT0:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    networks:
      - news-network
    command: celery -A app.tasks.scrape beat --loglevel=info

networks:
  news-network:
    name: news-network
